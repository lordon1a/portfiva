<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
  <title id="t">Portfiva</title>
  <desc id="d">The WhatsApp-first CRM for real estate teams: one inbox, AI replies and a live pipeline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f5ff"/><stop offset="1" stop-color="#ece4ff"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#d9d0f3"/>
    </pattern>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#4c1d95" flood-opacity=".18"/>
    </filter>
    <style>
      text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
      .word { font-size: 64px; font-weight: 800; fill: #0f172a; letter-spacing: -2px; }
      .tag { font-size: 22px; fill: #64748b; font-weight: 500; }
      .tag tspan.hl { fill: #6d28d9; font-weight: 700; }
      .nm { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .pv { font-size: 13px; fill: #64748b; }
      .bd { font-size: 10px; font-weight: 800; }
      .msg { opacity: 0; animation: in 9s cubic-bezier(.2,.8,.2,1) infinite; }
      .m2 { animation-delay: .6s; } .m3 { animation-delay: 1.2s; }
      @keyframes in {
        0% { opacity: 0; transform: translateX(28px); }
        6%, 88% { opacity: 1; transform: translateX(0); }
        96%, 100% { opacity: 0; transform: translateX(0); }
      }
    </style>
  </defs>

  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="24" fill="url(#dots)" opacity=".5"/>

  <!-- brand -->
  <g transform="translate(72 92)">
    <rect width="72" height="72" rx="21" fill="url(#brand)" filter="url(#sh)"/>
    <g transform="translate(14 14)" fill="none" stroke="#fff" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round">
      <path d="M9 21 L22 10 L35 21 V31 a3 3 0 0 1 -3 3 H19 l-6 5 v-5 h-1 a3 3 0 0 1 -3 -3 Z"/><path d="M18 25 h8"/>
    </g>
  </g>
  <text x="168" y="152" class="word">Portfiva</text>
  <text x="72" y="214" class="tag">The <tspan class="hl">WhatsApp-first CRM</tspan> for real estate teams</text>
  <text x="72" y="246" class="tag" style="font-size:17px">One inbox · AI replies · a pipeline that updates live</text>

  <!-- incoming messages -->
  <g class="msg m1" filter="url(#sh)">
    <rect x="760" y="46" width="440" height="64" rx="16" fill="#fff"/>
    <circle cx="796" cy="78" r="18" fill="#fde7f3"/><text x="796" y="83" text-anchor="middle" class="bd" style="font-size:12px" fill="#be185d">EA</text>
    <text x="826" y="72" class="nm">Elif Aydın</text>
    <rect x="908" y="60" width="26" height="16" rx="5" fill="#dcfce7"/><text x="921" y="72" text-anchor="middle" class="bd" fill="#16a34a">WA</text>
    <text x="826" y="94" class="pv">Is the 3+1 in Çankaya still available?</text>
  </g>
  <g class="msg m2" filter="url(#sh)">
    <rect x="800" y="128" width="400" height="64" rx="16" fill="#fff"/>
    <circle cx="836" cy="160" r="18" fill="#e0f2fe"/><text x="836" y="165" text-anchor="middle" class="bd" style="font-size:12px" fill="#0369a1">BK</text>
    <text x="866" y="154" class="nm">Burak Koç</text>
    <rect x="946" y="142" width="24" height="16" rx="5" fill="#e0f2fe"/><text x="958" y="154" text-anchor="middle" class="bd" fill="#0284c7">TG</text>
    <text x="866" y="176" class="pv">Sent you the signed rental form</text>
  </g>
  <g class="msg m3" filter="url(#sh)">
    <rect x="740" y="210" width="460" height="64" rx="16" fill="url(#brand)"/>
    <text x="764" y="236" class="bd" fill="#ede9fe" style="font-size:11px">✨ AI DRAFT</text>
    <text x="764" y="258" style="font-size:14px;font-weight:500" fill="#fff">Yes, it's available! Would Saturday 11:00 work for a viewing?</text>
  </g>
</svg>
